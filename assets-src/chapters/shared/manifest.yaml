      tan skin, wearing the same sand-coloured travel coat with rolled sleeves, aviator goggles pushed
      up on his forehead, the same leather satchel strap and small hourglass pendant, a friendly
      confident expression, body turned slightly to the right.

  - id: traveler-c
    kind: portrait
    followUp: true
    status: approved
    file: chapters/shared/raw/traveler-c.jpeg
    chat: b26b7f9d71fb5744
    subject: >-
      A third time traveler for the same game, in exactly the same style, costume, framing and
      background as the previous portraits: a young adult woman with medium-brown skin wearing a
